<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0d;
      --text: #e8e4dc;
      --muted: #6a6660;
      --accent: #c8b49a;
      --border: #222220;
      --gap: 50px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2.5rem;
      background: rgba(14,14,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--text);
      text-decoration: none;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--text); }

    /* ── HEADER COLLECTION ── */
    .collection-header {
      padding: 10rem 2.5rem 3rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }

    .collection-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .collection-meta {
      text-align: right;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 2;
    }

    /* ── MASONRY GRID ── */
    .gallery {
      columns: 1;
      column-gap: var(--gap);
      padding: var(--gap) 4rem 6rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    @media (max-width: 900px) { .gallery { columns: 2; } }
    @media (max-width: 500px) { .gallery { columns: 1; } }

    .photo-item {
      break-inside: avoid;
      margin-bottom: var(--gap);
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
      background: var(--border);
    }

    .photo-item img {
      width: 100%;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  filter 0.3s ease;
      filter: brightness(0.9);
    }

    .photo-item:hover img {
      transform: scale(1.03);
      filter: brightness(1);
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open { display: flex; }

    .lightbox-img-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .lightbox img {
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
    }

    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      width: 42px;
      height: 42px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 2px;
    }

    .lb-btn:hover { color: var(--text); border-color: var(--accent); }
    .lb-prev { left: 1.5rem; }
    .lb-next { right: 1.5rem; }

    .lb-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      width: 36px;
      height: 36px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 2px;
    }

    .lb-close:hover { color: var(--text); border-color: var(--accent); }

    .lb-counter {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer span {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Gégé</a>
    <a href="index.html" class="nav-back">← Collections</a>
  </nav>

  <header class="collection-header">
    <h1>Aether</h1>
    <div class="collection-meta">
      12 photos<br>
      2024
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════════════
       GALERIE — Pour ajouter une photo :
       Duplique un bloc .photo-item et change src="photos/cambodge/ta-photo.jpg"
       ══════════════════════════════════════════════════════════════════ -->

  <main class="gallery" id="gallery">

    <div class="photo-item">
      <img src="photos/photo1.jpg" alt="Photo 1" />
    </div>
    <div class="photo-item">
      <img src="photos/photo2.jpg" alt="Photo 2" />
    </div>
    <div class="photo-item">
      <img src="photos/photo3.jpg" alt="Photo 3" />
    </div>
    <div class="photo-item">
      <img src="photos/photo4.jpg" alt="Photo 4" />
    </div>

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-img-wrap">
      <button class="lb-btn lb-prev" id="lb-prev">‹</button>
      <img src="" alt="" id="lb-img" />
      <button class="lb-btn lb-next" id="lb-next">›</button>
    </div>
    <button class="lb-close" id="lb-close">✕</button>
    <span class="lb-counter" id="lb-counter"></span>
  </div>

  <footer>
    <span>© 2025 — Gégé</span>
    <a href="index.html">← Retour aux collections</a>
  </footer>

  <script>
    const items = Array.from(document.querySelectorAll('.photo-item img'));
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    let current = 0;

    function openLightbox(index) {
      current = index;
      lbImg.src = items[current].src;
      lbCounter.textContent = `${current + 1} / ${items.length}`;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      current = (current + dir + items.length) % items.length;
      lbImg.src = items[current].src;
      lbCounter.textContent = `${current + 1} / ${items.length}`;
    }

    items.forEach((img, i) => img.parentElement.addEventListener('click', () => openLightbox(i)));
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); navigate(-1); });
    document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); navigate(1); });
    lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target.closest('.lightbox-img-wrap') === lightbox.querySelector('.lightbox-img-wrap') && e.target === lightbox.querySelector('.lightbox-img-wrap')) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });
  </script>

</body>
</html>
